services:
  postgres:
    image: postgres:16-alpine
    container_name: bourse-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: bourse
      POSTGRES_USER: bourse
      POSTGRES_PASSWORD: bourse
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bourse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_dev_data:
